<h2>Nova transação</h2>

<form class="form-transacao" (ngSubmit)="salvar()">

  <div class="campo">
    <label for="descricao">Descrição</label>
    <input
      id="descricao"
      name="descricao"
      type="text"
      [(ngModel)]="descricao"
      required
    />
  </div>

  <div class="campo">
    <label for="valor">Valor</label>
    <input
      id="valor"
      name="valor"
      type="number"
      step="0.01"
      [(ngModel)]="valor"
      required
    />
  </div>

  <div class="campo">
    <label for="tipo">Tipo</label>
    <select
      id="tipo"
      name="tipo"
      [(ngModel)]="tipo"
    >
      <option value="RECEITA">Receita</option>
      <option value="DESPESA">Despesa</option>
    </select>
  </div>

  <div class="campo">
    <label for="data">Data</label>
    <input
      id="data"
      name="data"
      type="date"
      [(ngModel)]="data"
      required
    />
  </div>

  <div class="campo">
  <label for="categoriaId">Categoria</label>

  <select
    id="categoriaId"
    name="categoriaId"
    [(ngModel)]="categoriaId"
    required
  >
    <option [ngValue]="null" disabled>
      Selecione uma categoria
    </option>

    @for (categoria of categorias(); track categoria.id) {
      <option [ngValue]="categoria.id">
        {{ categoria.nome }}
      </option>
    }

  </select>
</div>

  <button type="submit" class="btnSalvar">Salvar transação</button>

</form>

@if(mensagem()){
  <p class="mensagem"
  [class.sucesso]="tipoMensagem() ==='sucesso'"
  [class.erro]="tipoMensagem() === 'erro'">
  {{ mensagem() }} </p>
}
