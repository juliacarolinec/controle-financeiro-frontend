<div class="container">
  <h1>{{titulo}}</h1>
  <h2>Resumo Financeiro</h2>
  <div class="card">
    <p>Saldo atual</p>
    <h3>{{saldo() | currency: 'BRL':'symbol':'1.2-2':'pt-BR'}}</h3>
  </div>

  <button (click)="alterarFormulario()">Nova Transação</button>
  @if(formularioVisivel()){
    <app-transacao-form (transacaoAdicionada)="atualizarLista()"></app-transacao-form>
  }
  <app-transacao-list (transacaoExcluida)="carregarSaldo()"></app-transacao-list>
</div>
